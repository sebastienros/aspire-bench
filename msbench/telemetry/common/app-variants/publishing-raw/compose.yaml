# Production deployment model: the admin backend and the static player frontend, built from this
# repository, on the environment's network. PostgreSQL and Redis are supplied by the environment.
name: bingo-prod
services:
  boardadmin:
    image: boardadmin:local
    build:
      context: .
      dockerfile: Dockerfile.dotnet
      args:
        PROJECT: BingoBoard.Admin
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_ENVIRONMENT: Production
      Authentication__AdminPassword: ${Parameters__admin_password:?}
      ConnectionStrings__db: ${ConnectionStrings__db:?}
      ConnectionStrings__cache: ${ConnectionStrings__cache:?}
    ports:
      - "127.0.0.1:18080:8080"
    networks: [bingo-net]
  bingoboard:
    image: bingoboard:local
    build:
      context: src/bingo-board
      dockerfile: Dockerfile.nginx
    environment:
      BINGO_ADMIN_URL: http://boardadmin:8080
    ports:
      - "127.0.0.1:18081:8080"
    networks: [bingo-net]
networks:
  bingo-net:
    external: true
