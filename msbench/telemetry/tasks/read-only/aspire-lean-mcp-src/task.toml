schema_version = "1.3"

[metadata]
suite = "aspire-telemetry"
scenario = "read-only"
variant = "aspire-lean-mcp-src"
fault_seed = 62

[agent]
timeout_sec = 900

[verifier]
timeout_sec = 300

[environment]
build_timeout_sec = 1800
cpus = 4
memory_mb = 8192
storage_mb = 20480
workdir = "/app"
network_mode = "public"
skills_dir = "/opt/agent-skills"

[environment.healthcheck]
command = "test -f /opt/benchmark/ready && docker info >/dev/null"
retries = 400

[[environment.mcp_servers]]
name = "aspire"
transport = "stdio"
command = "aspire"
args = ["agent", "mcp", "--non-interactive", "--nologo"]
