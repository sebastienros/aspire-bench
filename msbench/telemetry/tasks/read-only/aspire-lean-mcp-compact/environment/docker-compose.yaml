services:
  main:
    privileged: true
    build:
      args:
        APP_KIND: aspire
        SKILLS: lean
        FAULT: read-only
        CLI_KIND: source
        CLI_PATCH: mcp-compact-telemetry
      additional_contexts:
        suite: ${TELEMETRY_SUITE_CONTEXT:-https://github.com/sebastienros/aspire-bench.git#a6dd5584ed70f553ed841cb6eb0f5dc89af0db02:msbench/telemetry/common}
        raw-app: ${TELEMETRY_RAW_APP_CONTEXT:-https://github.com/sebastienros/aspire-bench.git#baacba3e17181491c9a4d419db7d0e6763c3d363:msbench/bingo/common/raw-app}
        aspire-app: ${TELEMETRY_ASPIRE_APP_CONTEXT:-https://github.com/sebastienros/aspire-bench.git#baacba3e17181491c9a4d419db7d0e6763c3d363:msbench/bingo/common/aspire-app}
