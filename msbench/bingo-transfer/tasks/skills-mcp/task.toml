schema_version = "1.3"
artifacts = ["/app/benchmark-endpoints.json"]

[metadata]
variant = "skills-mcp"
scenario = "x01-held-out-acl-transfer"
fault_seed = 83

[agent]
timeout_sec = 900

[verifier]
timeout_sec = 300

[environment]
build_timeout_sec = 1200
cpus = 4
memory_mb = 8192
storage_mb = 20480
workdir = "/app"
network_mode = "public"
skills_dir = "/opt/aspire-skills"

[environment.healthcheck]
command = "test -f /opt/benchmark/ready && docker info >/dev/null"
retries = 300

[[environment.mcp_servers]]
name = "aspire"
transport = "stdio"
command = "aspire"
args = ["agent", "mcp", "--non-interactive", "--nologo"]
