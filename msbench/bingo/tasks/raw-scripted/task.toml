schema_version = "1.3"
multi_step_reward_strategy = "final"
artifacts = ["/app/benchmark-endpoints.json","/app/benchmark-services-health.json","/app/benchmark-database-health.json","/app/benchmark-redis-health.json"]

[metadata]
variant = "raw-scripted"
scenario = "health-checks"

[agent]
timeout_sec = 900

[verifier]
timeout_sec = 300

[environment]
build_timeout_sec = 1200
cpus = 4
memory_mb = 8192
storage_mb = 20480
workdir = "/app"
network_mode = "public"

[environment.healthcheck]
command = "docker info >/dev/null"
retries = 30

[[steps]]
name = "startup"

[[steps]]
name = "services"

[[steps]]
name = "database"

[[steps]]
name = "redis"
