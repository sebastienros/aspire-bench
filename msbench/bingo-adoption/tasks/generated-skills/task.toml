schema_version = "1.3"
artifacts = ["/app/benchmark-endpoints.json", "/app/apphost.cs", "/app/aspire.config.json"]

[metadata]
variant = "generated-skills"
scenario = "aspire-adoption"

[agent]
timeout_sec = 900

[verifier]
timeout_sec = 300

[environment]
build_timeout_sec = 1200
cpus = 4
memory_mb = 8192
storage_mb = 20480
workdir = "/app"
network_mode = "public"
skills_dir = "/opt/aspire-skills"

[environment.healthcheck]
command = "docker info >/dev/null"
retries = 30
