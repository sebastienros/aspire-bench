schema_version = "1.3"
artifacts = ["/app/benchmark-endpoints.json", "/neighbor-app/benchmark-endpoints.json"]

[metadata]
variant = "aspire"
scenario = "s01-two-real-apps"

[agent]
timeout_sec = 900

[verifier]
timeout_sec = 300

[environment]
build_timeout_sec = 1200
cpus = 4
memory_mb = 8192
storage_mb = 20480
workdir = "/app"
network_mode = "public"
skills_dir = "/opt/aspire-skills"

[environment.healthcheck]
command = "test -f /opt/benchmark/ready && docker info >/dev/null"
retries = 300
