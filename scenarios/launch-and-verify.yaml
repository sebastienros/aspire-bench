name: launch-and-verify
version: "1"
type: capability
description: Investigate and repair startup failures, then verify the complete application.
defaults:
  executor: isolated-benchmark
  runs: 1
  timeout: 15m
stimuli:
  - name: launch-and-verify
    prompt: |
      Start the application and verify that all its services are up and working.
      Investigate and fix any startup problems. Leave the application running.
      Save its admin and frontend URLs in benchmark-endpoints.json in the workspace root:
      {"admin":"http://localhost:PORT","frontend":"http://localhost:PORT"}.
    graders:
      - type: program
        name: endpoint-contract
        required: true
        config:
          program: bash
          args: [-c, 'exec bash "$ASPIRE_BENCH_ROOT/scripts/verify.sh" endpoint-contract']
          timeout: 30s
      - type: program
        name: objective-success
        required: true
        config:
          program: bash
          args: [-c, 'exec bash "$ASPIRE_BENCH_ROOT/scripts/verify.sh"']
          timeout: 5m
scoring:
  threshold: 1
