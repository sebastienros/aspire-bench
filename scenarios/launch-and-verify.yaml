name: launch-and-verify
version: "1"
type: capability
description: Investigate and repair startup failures, then verify the complete application.
defaults:
  executor: isolated-benchmark
  runs: 1
  timeout: 15m
stimuli:
  - name: launch-and-verify
    prompt: |
      Launch this application's complete local stack.
      Investigate any startup failures using logs and the application's configuration.
      Diagnose and fix their root cause, then restart the affected services and verify
      that the complete stack works. You may repair startup configuration in compose.yaml
      or apphost.cs when present; do not bypass failing dependencies or replace them.
      Verify that the admin portal and player frontend are reachable, database migrations
      and seeding have completed, and PostgreSQL and Redis are working. Demonstrate that
      the frontend's backend API and SignalR proxy work. Leave the stack running.
      Write benchmark-endpoints.json in the workspace root with exactly these keys:
      {"admin":"http://localhost:PORT","frontend":"http://localhost:PORT"}.
      Use the run-scoped configuration already provided in your environment. Do not
      replace services with mocks, modify other application source or guidance, or access anything outside
      this workspace. Do not stop unrelated services or change global configuration.
      The harness performs independent verification and cleanup after you finish.
    graders:
      - type: program
        name: objective-success
        required: true
        config:
          program: bash
          args: [-c, 'exec bash "$ASPIRE_BENCH_ROOT/scripts/verify.sh"']
          timeout: 5m
scoring:
  threshold: 1
